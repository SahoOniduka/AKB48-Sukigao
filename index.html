<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKB48 神7 好き顔ソート</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #fff0f5;
            color: #333;
            margin: 0;
            padding: 15px;
        }

        h1 { font-size: 22px; color: #e6005c; margin-bottom: 5px; }
        p.desc { font-size: 13px; color: #666; margin-top: 0; }

        .step-container {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto 20px;
        }

        .page-info { font-weight: bold; color: #e6005c; margin-bottom: 10px; }
        .member-grid-9 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .card {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
            transition: 0.2s;
            background: #fafafa;
            position: relative;
        }
        .card.selected {
            border-color: #e6005c;
            background: #ffe6f0;
        }
        .card.selected::after {
            content: "✓";
            position: absolute;
            top: 2px;
            right: 5px;
            color: #e6005c;
            font-weight: bold;
            font-size: 16px;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
        }
        .card .name {
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            background: #e6005c;
            color: #fff;
            cursor: pointer;
        }
        button:disabled { background: #ccc; }
        .btn-secondary { background: #666; }

        /* 比較（2択）画面用スタイル */
        .battle-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        .battle-card {
            flex: 1;
            border: 3px solid #ffb3d9;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            background: #fff;
            transition: 0.2s;
        }
        .battle-card:hover {
            border-color: #e6005c;
            background: #ffe6f0;
            transform: translateY(-3px);
        }
        .battle-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
        }
        .battle-card .name {
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
        }
        .vs-text {
            font-size: 18px;
            font-weight: bold;
            color: #e6005c;
        }

        /* 結果発表（神7ランキング）用スタイル */
        #capture-area {
            background: #fff;
            padding: 15px;
            display: inline-block;
            border-radius: 8px;
        }
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            max-width: 350px;
            margin: 0 auto;
        }
        .rank-item {
            display: flex;
            align-items: center;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px 10px;
            gap: 12px;
        }
        .rank-badge {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: #e6005c;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .rank-item:nth-child(1) .rank-badge { background: #ffd700; color: #333; } /* 1位ゴールド */
        .rank-item:nth-child(2) .rank-badge { background: #c0c0c0; color: #333; } /* 2位シルバー */
        .rank-item:nth-child(3) .rank-badge { background: #cd7f32; } /* 3位ブロンズ */

        .rank-img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .rank-name {
            font-size: 14px;
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>AKB48 神7 好き顔ソート</h1>

    <!-- フェーズ1：予選（14人選択） -->
    <div id="phase1" class="step-container">
        <h2>【予選】メンバーを14人選ぶ</h2>
        <p class="desc">ソートにかけたいメンバーを、最大<b>14人</b>まで選んでね！</p>
        <div class="page-info" id="page-counter">1 / 5 ページ目 （選択中: <span id="selected-count">0</span> / 14人）</div>

        <div class="member-grid-9" id="prelim-grid"></div>

        <div class="btn-group">
            <button id="prev-btn" class="btn-secondary" onclick="changePage(-1)">前へ</button>
            <button id="next-btn" onclick="changePage(1)">次へ</button>
            <button id="to-sort-btn" onclick="startSort()" disabled>この14人でソート開始！</button>
        </div>
    </div>

    <!-- フェーズ2：2択バトル（ソート中） -->
    <div id="phase2" class="step-container hidden">
        <h2>【勝ち上がりバトル】どっちが好き？</h2>
        <p class="desc" id="progress-desc">比較中...</p>

        <div class="battle-container">
            <div class="battle-card" onclick="selectWinner(0)">
                <img id="fighter0-img" src="" crossorigin="anonymous">
                <div class="name" id="fighter0-name"></div>
            </div>
            <div class="vs-text">VS</div>
            <div class="battle-card" onclick="selectWinner(1)">
                <img id="fighter1-img" src="" crossorigin="anonymous">
                <div class="name" id="fighter1-name"></div>
            </div>
        </div>
    </div>

    <!-- フェーズ3：結果発表（神7ランキング） -->
    <div id="phase3" class="step-container hidden">
        <h2>🎉 あなたの神7ランキング完成！</h2>
        <p class="desc">1位〜7位までの結果だよ</p>

        <div id="capture-area">
            <div style="font-weight:bold; color:#e6005c; margin-bottom:12px; font-size:16px;">My AKB48 神7 Ranking</div>
            <div class="ranking-list" id="ranking-list"></div>
        </div>

        <div style="margin: 20px 0 10px;" class="btn-group">
            <button onclick="downloadImage()">ランキング画像を保存</button>
            <button class="btn-secondary" onclick="location.reload()">最初からやり直す</button>
        </div>
    </div>

    <script>
        const allMembers = [
            "岩立 沙穂", "福岡 聖菜", "小栗 有以", "行天 優莉奈", "倉野尾 成美", "坂川 陽香", "下尾 みう", "髙橋 彩音", "徳永 羚海",
            "永野 芹佳", "橋本 陽菜", "千葉 恵里", "黒須 遥香", "長友 彩海", "武藤 小麟", "山内 瑞葵", "山根 涼羽", "太田 有紀",
            "佐藤 綺星", "橋本 恵理子", "畠山 希美", "平田 侑希", "布袋 百椛", "正鋳 真優", "水島 美結", "山﨑 空", "秋山 由奈",
            "新井 彩永", "工藤 華純", "久保 姫菜乃", "迫 由芽実", "成田 香姫奈", "八木 愛月", "山口 結愛", "伊藤 百花", "奥本 カイリ",
            "川村 結衣", "大賀 彩姫", "近藤 沙樹", "丸山 ひなた", "髙橋 舞桜", "田中 沙友利", "牧戸 愛茉", "森川 優", "渡邉 葵心"
        ].map((name, index) => ({
            id: index + 1,
            name: name,
            img: `https://placehold.jp/24/ffb3d9/ffffff/200x200.png?text=${encodeURIComponent(name)}`
        }));

        let prelimSelected = [];
        let currentPage = 0;
        const PAGE_SIZE = 9;
        const MAX_PRELIM = 14;

        // ソート用の変数
        let sortQueues = [];
        let parentQueue = [];
        let currentLeft = [];
        let currentRight = [];
        let sortedResults = [];
        let totalComparisons = 0;
        let currentComparisonCount = 0;

        renderPrelimPage();

        function renderPrelimPage() {
            const grid = document.getElementById('prelim-grid');
            grid.innerHTML = '';
            const start = currentPage * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageMembers = allMembers.slice(start, end);

            pageMembers.forEach(member => {
                const isSelected = prelimSelected.some(m => m.id === member.id);
                const card = document.createElement('div');
                card.className = `card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => togglePrelimSelect(member);
                card.innerHTML = `<img src="${member.img}" crossorigin="anonymous"><span class="name">${member.name}</span>`;
                grid.appendChild(card);
            });

            const maxPage = Math.ceil(allMembers.length / PAGE_SIZE);
            document.getElementById('page-counter').innerHTML = `${currentPage + 1} / ${maxPage} ページ目 （選択中: <b style="color:#e6005c">${prelimSelected.length}</b> / ${MAX_PRELIM}人）`;
            document.getElementById('prev-btn').disabled = currentPage === 0;
            document.getElementById('next-btn').disabled = currentPage >= maxPage - 1;

            const sortBtn = document.getElementById('to-sort-btn');
            if (prelimSelected.length > 1) {
                sortBtn.disabled = false;
                sortBtn.innerText = `この${prelimSelected.length}人でソート開始！`;
            } else {
                sortBtn.disabled = true;
                sortBtn.innerText = `2人以上選んでね`;
            }
        }

        function togglePrelimSelect(member) {
            const index = prelimSelected.findIndex(m => m.id === member.id);
            if (index > -1) {
                prelimSelected.splice(index, 1);
            } else {
                if (prelimSelected.length < MAX_PRELIM) {
                    prelimSelected.push(member);
                } else {
                    alert(`予選で選べるのは最大${MAX_PRELIM}人までです！`);
                }
            }
            renderPrelimPage();
        }

        function changePage(delta) {
            currentPage += delta;
            renderPrelimPage();
        }

        // --- マージソート（2択比較ロジック）の開始 ---
        function startSort() {
            document.getElementById('phase1').classList.add('hidden');
            document.getElementById('phase2').classList.remove('hidden');

            // 選択されたメンバーをシャッフルして初期化
            let list = [...prelimSelected];
            sortQueues = list.map(item => [item]);
            nextMergeStep();
        }

        function nextMergeStep() {
            if (sortQueues.length <= 1) {
                // ソート完了！結果発表へ
                showRanking();
                return;
            }

            parentQueue = [];
            for (let i = 0; i < sortQueues.length; i += 2) {
                if (i + 1 < sortQueues.length) {
                    parentQueue.push({
                        left: sortQueues[i],
                        right: sortQueues[i+1],
                        merged: []
                    });
                } else {
                    parentQueue.push({
                        left: sortQueues[i],
                        right: [],
                        merged: sortQueues[i]
                    });
                }
            }
            sortQueues = [];
            processNextPair();
        }

        function processNextPair() {
            if (parentQueue.length === 0) {
                nextMergeStep();
                return;
            }

            let currentPair = parentQueue[0];

            // 片方が空なら自動マージ
            if (currentPair.left.length === 0) {
                currentPair.merged.push(...currentPair.right);
                parentQueue.shift();
                sortQueues.push(currentPair.merged);
                processNextPair();
                return;
            }
            if (currentPair.right.length === 0) {
                currentPair.merged.push(...currentPair.left);
                parentQueue.shift();
                sortQueues.push(currentPair.merged);
                processNextPair();
                return;
            }

            // 比較画面に2人をセット
            currentLeft = currentPair.left;
            currentRight = currentPair.right;

            document.getElementById('fighter0-img').src = currentLeft[0].img;
            document.getElementById('fighter0-name').innerText = currentLeft[0].name;
            document.getElementById('fighter1-img').src = currentRight[0].img;
            document.getElementById('fighter1-name').innerText = currentRight[0].name;
        }

        function selectWinner(choice) {
            let currentPair = parentQueue[0];
            if (choice === 0) {
                currentPair.merged.push(currentPair.left.shift());
            } else {
                currentPair.merged.push(currentPair.right.shift());
            }

            if (currentPair.left.length === 0 || currentPair.right.length === 0) {
                if (currentPair.left.length > 0) currentPair.merged.push(...currentPair.left);
                if (currentPair.right.length > 0) currentPair.merged.push(...currentPair.right);
                parentQueue.shift();
                sortQueues.push(currentPair.merged);
            }

            processNextPair();
        }

        function showRanking() {
            document.getElementById('phase2').classList.add('hidden');
            document.getElementById('phase3').classList.remove('hidden');

            const rankingList = document.getElementById('ranking-list');
            rankingList.innerHTML = '';

            // sortQueues[0] が全ソートされた配列
            const sorted = sortQueues[0] || [];
            // 上位7人（または選択人数分）を神7として表示
            const kami7 = sorted.slice(0, 7);

            kami7.forEach((member, index) => {
                const item = document.createElement('div');
                item.className = 'rank-item';
                item.innerHTML = `
                    <div class="rank-badge">${index + 1}</div>
                    <img class="rank-img" src="${member.img}" crossorigin="anonymous">
                    <div class="rank-name">${member.name}</div>
                `;
                rankingList.appendChild(item);
            });
        }

        function downloadImage() {
            const capture = document.getElementById('capture-area');
            html2canvas(capture, { scale: 2, useCORS: true }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'akb48_kami7_ranking.png';
                a.click();
            });
        }
    </script>
</body>
</html>
