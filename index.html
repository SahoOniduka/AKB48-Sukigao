<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKB48 神7 好き顔メーカー</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #fff0f5;
            color: #333;
            margin: 0;
            padding: 15px;
        }

        h1 { font-size: 22px; color: #e6005c; margin-bottom: 5px; }
        p.desc { font-size: 13px; color: #666; margin-top: 0; }

        .step-container {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto 20px;
        }

        .page-info { font-weight: bold; color: #e6005c; margin-bottom: 10px; }
        .member-grid-9 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .card {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
            transition: 0.2s;
            background: #fafafa;
            position: relative;
        }
        .card.selected {
            border-color: #e6005c;
            background: #ffe6f0;
        }
        .card.selected::after {
            content: "✓";
            position: absolute;
            top: 2px;
            right: 5px;
            color: #e6005c;
            font-weight: bold;
            font-size: 16px;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
        }
        .card .name {
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            background: #e6005c;
            color: #fff;
            cursor: pointer;
        }
        button:disabled { background: #ccc; }
        .btn-secondary { background: #666; }

        #capture-area {
            background: #fff;
            padding: 15px;
            display: inline-block;
            border-radius: 8px;
        }
        /* 神7用グリッド（上段3人、中段3人、下段1人などバランス良く） */
        .grid-kami7 {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 4px;
            background: #fff;
            justify-content: center;
        }
        .slot {
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #ddd;
            width: 100px;
            height: 100px;
        }
        .slot.center-slot {
            grid-column: 2; /* 7人目を綺麗に配置するための調整 */
        }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        .slot .label {
            position: absolute;
            bottom: 0; width: 100%;
            background: rgba(230, 0, 92, 0.85);
            color: #fff; font-size: 10px; font-weight: bold; padding: 2px 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>AKB48 神7 好き顔メーカー</h1>

    <div id="phase1" class="step-container">
        <h2>【予選】気になるメンバーを選択</h2>
        <p class="desc">最大<b>14人</b>まで選んで「神7決戦へ進む」を押してね！</p>
        <div class="page-info" id="page-counter">1 / 5 ページ目 （選択中: <span id="selected-count">0</span> / 14人）</div>

        <div class="member-grid-9" id="prelim-grid"></div>

        <div class="btn-group">
            <button id="prev-btn" class="btn-secondary" onclick="changePage(-1)">前へ</button>
            <button id="next-btn" onclick="changePage(1)">次へ</button>
            <button id="to-phase2-btn" onclick="startFinal()">神7決戦へ進む</button>
        </div>
    </div>

    <div id="phase2" class="step-container hidden">
        <h2>【本選】マイスター神7（7人）を選出</h2>
        <p class="desc">予選で選んだメンバーから、厳選して7人を配置してね</p>

        <div id="capture-area">
            <div style="font-weight:bold; color:#e6005c; margin-bottom:8px;">My AKB48 神7</div>
            <div class="grid-kami7" id="final-grid"></div>
        </div>

        <div style="margin: 15px 0;" class="btn-group">
            <button onclick="downloadImage()">画像を保存してシェア</button>
            <button class="btn-secondary" onclick="backToPrelim()">予選に戻る</button>
        </div>

        <h3>予選通過メンバー（タップで神7枠に追加/解除）</h3>
        <div class="member-grid-9" id="final-candidates"></div>
    </div>

    <script>
        const allMembers = [
            "岩立 沙穂", "福岡 聖菜", "小栗 有以", "行天 優莉奈", "倉野尾 成美", "坂川 陽香", "下尾 みう", "髙橋 彩音", "徳永 羚海",
            "永野 芹佳", "橋本 陽菜", "千葉 恵里", "黒須 遥香", "長友 彩海", "武藤 小麟", "山内 瑞葵", "山根 涼羽", "太田 有紀",
            "佐藤 綺星", "橋本 恵理子", "畠山 希美", "平田 侑希", "布袋 百椛", "正鋳 真優", "水島 美結", "山﨑 空", "秋山 由奈",
            "新井 彩永", "工藤 華純", "久保 姫菜乃", "迫 由芽実", "成田 香姫奈", "八木 愛月", "山口 結愛", "伊藤 百花", "奥本 カイリ",
            "川村 結衣", "大賀 彩姫", "近藤 沙樹", "丸山 ひなた", "髙橋 舞桜", "田中 沙友利", "牧戸 愛茉", "森川 優", "渡邉 葵心"
        ].map((name, index) => ({
            id: index + 1,
            name: name,
            img: `https://placehold.jp/24/ffb3d9/ffffff/200x200.png?text=${encodeURIComponent(name)}`
        }));

        let prelimSelected = [];
        let finalSelected = [];
        let currentPage = 0;
        const PAGE_SIZE = 9;
        const MAX_PRELIM = 14;
        const KAMI_7 = 7;

        renderPrelimPage();

        function renderPrelimPage() {
            const grid = document.getElementById('prelim-grid');
            grid.innerHTML = '';
            const start = currentPage * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageMembers = allMembers.slice(start, end);

            pageMembers.forEach(member => {
                const isSelected = prelimSelected.some(m => m.id === member.id);
                const card = document.createElement('div');
                card.className = `card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => togglePrelimSelect(member);
                card.innerHTML = `<img src="${member.img}" crossorigin="anonymous"><span class="name">${member.name}</span>`;
                grid.appendChild(card);
            });

            const maxPage = Math.ceil(allMembers.length / PAGE_SIZE);
            document.getElementById('page-counter').innerHTML = `${currentPage + 1} / ${maxPage} ページ目 （選択中: <b style="color:#e6005c">${prelimSelected.length}</b> / ${MAX_PRELIM}人）`;
            document.getElementById('prev-btn').disabled = currentPage === 0;
            document.getElementById('next-btn').disabled = currentPage >= maxPage - 1;
        }

        function togglePrelimSelect(member) {
            const index = prelimSelected.findIndex(m => m.id === member.id);
            if (index > -1) {
                prelimSelected.splice(index, 1);
            } else {
                if (prelimSelected.length < MAX_PRELIM) {
                    prelimSelected.push(member);
                } else {
                    alert(`予選で選べるのは最大${MAX_PRELIM}人までです！`);
                }
            }
            renderPrelimPage();
        }

        function changePage(delta) {
            currentPage += delta;
            renderPrelimPage();
        }

        function startFinal() {
            if (prelimSelected.length === 0) {
                alert("メンバーが1人以上選ばれていますか？予選で選んでから進んでね！");
                return;
            }
            document.getElementById('phase1').classList.add('hidden');
            document.getElementById('phase2').classList.remove('hidden');
            renderFinalGrid();
            renderFinalCandidates();
        }

        function backToPrelim() {
            document.getElementById('phase2').classList.add('hidden');
            document.getElementById('phase1').classList.remove('hidden');
        }

        function renderFinalGrid() {
            const grid = document.getElementById('final-grid');
            grid.innerHTML = '';
            for (let i = 0; i < KAMI_7; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                // 7人目を中央に配置するためのスタイル調整（お好みで）
                if (i === 6) {
                    slot.classList.add('center-slot');
                }
                if (finalSelected[i]) {
                    slot.innerHTML = `<img src="${finalSelected[i].img}" crossorigin="anonymous"><div class="label">${finalSelected[i].name}</div>`;
                    slot.onclick = () => removeFinalSelect(i);
                } else {
                    slot.innerHTML = `<span style="color:#ccc; font-size:20px;">+</span>`;
                }
                grid.appendChild(slot);
            }
        }

        function renderFinalCandidates() {
            const container = document.getElementById('final-candidates');
            container.innerHTML = '';
            prelimSelected.forEach(member => {
                const isSelected = finalSelected.some(m => m.id === member.id);
                const card = document.createElement('div');
                card.className = `card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => toggleFinalSelect(member);
                card.innerHTML = `<img src="${member.img}" crossorigin="anonymous"><span class="name">${member.name}</span>`;
                container.CDF = true;
                container.appendChild(card);
            });
        }

        function toggleFinalSelect(member) {
            const index = finalSelected.findIndex(m => m.id === member.id);
            if (index > -1) {
                finalSelected.splice(index, 1);
            } else {
                if (finalSelected.length < KAMI_7) finalSelected.push(member);
                else alert("神7枠（7人）がすでにいっぱいです！枠をタップして外してください。");
            }
            renderFinalGrid();
            renderFinalCandidates();
        }

        function removeFinalSelect(index) {
            finalSelected.splice(index, 1);
            renderFinalGrid();
            renderFinalCandidates();
        }

        function downloadImage() {
            if (finalSelected.length < KAMI_7 && !confirm("まだ7人選ばれていませんが、このまま保存しますか？")) return;
            const capture = document.getElementById('capture-area');
            html2canvas(capture, { scale: 2, useCORS: true }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'akb48_kami7.png';
                a.click();
            });
        }
    </script>
</body>
</html>
